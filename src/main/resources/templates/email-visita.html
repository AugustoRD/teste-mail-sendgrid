<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nova Solicitação de Visita</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .header { background-color: #28a745; color: white; padding: 10px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; }
        .footer { font-size: 12px; color: #777; text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
        strong { color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🌱 Nova Visita Solicitada</h2>
        </div>
        <div class="content">
            <p>Olá, equipe!</p>
            <p>Recebemos uma nova solicitação de visita. Veja os detalhes abaixo:</p>
            
            <p><strong>Nome:</strong> {{nome}}</p>
            <p><strong>E-mail:</strong> {{email}}</p>
            
            <hr>
            
            <p><strong>Mensagem do Visitante:</strong></p>
            <p style="background-color: #f9f9f9; padding: 15px; border-left: 4px solid #28a745;">
                {{mensagem}}
            </p>
        </div>
        <div class="footer">
            <p>Para responder, basta clicar em "Responder" no seu e-mail.</p>
        </div>
    </div>
</body>
</html>
